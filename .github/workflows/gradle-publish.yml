# When a GitHub Release is created, this workflow builds the jar for every Stonecutter node (a
# Minecraft version + loader combination), attaches them to the Release, and publishes each to
# Modrinth. Requires the MODRINTH_TOKEN secret and a real projectId configured in build.gradle.kts'
# modrinth{} block.

name: Build and Publish Release

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history, not just the tag commit: needed to push the version-bump commit below
        # as a fast-forward of the release's target branch.
        fetch-depth: 0

    - name: Ensure mod_version matches the release tag
      # mod_version (gradle.properties) drives the artifact/Modrinth version; the release tag is
      # what users and Modrinth associate the build with. If a release is cut from a tag that
      # doesn't match, fix gradle.properties here so the build below uses the right version, and
      # push that fix to the release's target branch to keep the repo in sync going forward.
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        TARGET_BRANCH: ${{ github.event.release.target_commitish }}
      run: |
        tag_version="${RELEASE_TAG#v}"
        current_version=$(sed -n 's/^mod_version=//p' gradle.properties)
        if [ "$tag_version" = "$current_version" ]; then
          echo "mod_version ($current_version) already matches release tag $RELEASE_TAG"
          exit 0
        fi
        echo "mod_version ($current_version) doesn't match release tag $RELEASE_TAG, updating to $tag_version"
        sed -i "s/^mod_version=.*/mod_version=$tag_version/" gradle.properties
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -am "chore: bump mod_version to $tag_version to match release tag $RELEASE_TAG"
        git push origin "HEAD:refs/heads/$TARGET_BRANCH" || \
          echo "::warning::couldn't push the mod_version fix to $TARGET_BRANCH (it may have moved since the tag was cut); update gradle.properties manually. The current build still uses the corrected version."

    # The Gradle daemon must run on the newest Java version required by any node (21, in this project).
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle
      # Without a project argument, Gradle runs "build" on the root project and every subproject
      # that declares it, building all Stonecutter nodes in one call.
      run: ./gradlew build

    - name: Attach jars to the GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        for dir in versions/*/build/libs; do
          JAR=$(find "$dir" -maxdepth 1 -name "*.jar" ! -name "*-sources.jar")
          if [ -n "$JAR" ]; then
            echo "Uploading $JAR to release $RELEASE_TAG"
            gh release upload "$RELEASE_TAG" "$JAR" --clobber --repo "${{ github.repository }}"
          fi
        done

    - name: Publish to Modrinth
      # Same principle as "build": without a project argument, publishes every node in one call.
      # continue-on-error: a Modrinth-side hiccup (rate limit, duplicate version, etc.) shouldn't
      # block the Release — the jars are already attached to it by the previous step regardless.
      continue-on-error: true
      run: ./gradlew modrinth
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        CHANGELOG: ${{ github.event.release.body }}
