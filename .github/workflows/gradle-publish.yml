# When a GitHub Release is created, this workflow builds the jar for every Stonecutter node (a
# Minecraft version + loader combination), attaches them to the Release, and publishes each to
# Modrinth. Requires the MODRINTH_TOKEN secret and a real projectId configured in build.gradle.kts'
# modrinth{} block.

name: Build and Publish Release

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    # The Gradle daemon must run on the newest Java version required by any node (21, in this project).
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle
      # Without a project argument, Gradle runs "build" on the root project and every subproject
      # that declares it, building all Stonecutter nodes in one call.
      run: ./gradlew build

    - name: Attach jars to the GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        for dir in versions/*/build/libs; do
          JAR=$(find "$dir" -maxdepth 1 -name "*.jar" ! -name "*-sources.jar")
          if [ -n "$JAR" ]; then
            echo "Uploading $JAR to release $RELEASE_TAG"
            gh release upload "$RELEASE_TAG" "$JAR" --clobber --repo "${{ github.repository }}"
          fi
        done

    - name: Publish to Modrinth
      # Same principle as "build": without a project argument, publishes every node in one call.
      # continue-on-error: a Modrinth-side hiccup (rate limit, duplicate version, etc.) shouldn't
      # block the Release — the jars are already attached to it by the previous step regardless.
      continue-on-error: true
      run: ./gradlew modrinth
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        CHANGELOG: ${{ github.event.release.body }}
